name: Build for Windows 10/11

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win10-11:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Build (MSVC, release)
        run: cargo build --release

      - name: Rename binary
        shell: pwsh
        run: |
          $src = "target/release/mc-downloader.exe"
          if (Test-Path $src) {
            Move-Item $src "target/release/mc-downloader-win10-11.exe"
          }

      - name: Upload artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: win10-11-msvc-release
          path: target/release/mc-downloader-win10-11.exe

      - name: Upload to Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/mc-downloader-win10-11.exe
          generate_release_notes: true