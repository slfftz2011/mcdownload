name: Build for Windows 7

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-win7:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 锁定 1.75.0，并安装 GNU 目标
      - name: Install Rust 1.75.0 (GNU)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0
          targets: x86_64-pc-windows-gnu

      # 将 MSYS2 的 MinGW 链接器加入 PATH，并设置默认构建目标
      - name: Setup MinGW / GNU target
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # windows-latest  runner 通常已预装 MSYS2 在 C:\msys64
          # 如果没有，可以取消下一行的注释，使用 taiki-e/setup-cross-toolchain-action
          # 但一般来说直接利用 runner 自带的即可
          echo "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 如果 runner 没有自带 MinGW，用 MSYS2 action 安装（推荐保留以保稳定）
      - name: Setup MSYS2 (if needed)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-toolchain

      - name: Add MinGW to PATH (MSYS2)
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Pin idna_adapter to use unicode-rs backend
        run: cargo update -p idna_adapter --precise 1.1.0

      - name: Build (GNU target, release)
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win7-gnu-release
          path: target/x86_64-pc-windows-gnu/release/*.exe