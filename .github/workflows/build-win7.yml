name: Build for Windows 7

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-win7:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 锁定 1.75.0，并安装 GNU 目标
      - name: Install Rust 1.75.0 (GNU)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0
          targets: x86_64-pc-windows-gnu

      # 将 MSYS2 的 MinGW 链接器加入 PATH，并设置默认构建目标
      - name: Setup MinGW / GNU target
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # windows-latest  runner 通常已预装 MSYS2 在 C:\msys64
          # 如果没有，可以取消下一行的注释，使用 taiki-e/setup-cross-toolchain-action
          # 但一般来说直接利用 runner 自带的即可
          echo "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 如果 runner 没有自带 MinGW，用 MSYS2 action 安装（推荐保留以保稳定）
      - name: Setup MSYS2 (if needed)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-toolchain

      - name: Add MinGW to PATH (MSYS2)
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Pin dependencies
        run: |
          cargo update -p idna_adapter --precise 1.1.0
          cargo update -p quinn --precise 0.11.8 || true
          cargo update -p quinn-proto --precise 0.11.14 || true
          cargo update -p hyper-util --precise 0.1.20
      
      - name: Downgrade incompatible dependencies
        shell: pwsh
        run: |
          # 循环尝试构建，直到成功或无法自动修复
          $maxAttempts = 10
          for ($i = 1; $i -le $maxAttempts; $i++) {
            $output = cargo build --release 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "构建成功！"
              break
            }
            
            # 从错误信息中提取需要降级的 crate 名称
            $match = [regex]::Match($output, 'failed to parse manifest at `.*?([^\\/]+)-[\d.]+\\Cargo\.toml`')
            if (-not $match.Success) {
              # 如果不是 edition2024 类型的错误，直接退出循环，让后续步骤报错
              Write-Host "遇到非 Edition 2024 错误，停止自动降级。"
              $output | Write-Host
              exit 1
            }
            
            $crateName = $match.Groups[1].Value
            Write-Host "检测到不兼容依赖: $crateName，尝试降级..."
            
            # 这里需要你根据具体情况，为每个 crate 指定一个已知兼容的版本
            # 例如对于 zeroize，我们用 1.8.1
            if ($crateName -eq "zeroize") {
              cargo update -p $crateName --precise 1.8.1
            } else {
              Write-Host "没有为 $crateName 预设兼容版本，无法自动修复。"
              exit 1
            }
          }

      - name: Build (GNU target, release)
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win7-gnu-release
          path: target/x86_64-pc-windows-gnu/release/*.exe