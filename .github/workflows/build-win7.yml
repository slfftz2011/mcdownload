name: Build for Windows 7

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win7:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.75.0 (GNU)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0
          targets: x86_64-pc-windows-gnu

      - name: Setup MSYS2 / MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-toolchain

      - name: Configure GNU target
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 已知会因 Edition 2024 / MSRV 漂移的依赖，一次性钉死
      - name: Pin known-incompatible dependencies
        run: |
          cargo update -p idna_adapter --precise 1.1.0
          cargo update -p quinn --precise 0.11.8 || true
          cargo update -p quinn-proto --precise 0.11.14 || true
          cargo update -p hyper-util --precise 0.1.20
          cargo update -p tokio --precise 1.53.1
          cargo update -p tokio-macros --precise 2.6.1 || true
          cargo update -p tokio-util --precise 0.7.17
          cargo update -p hyper-rustls --precise 0.27.7

      # 循环兜底：碰到漏网的 Edition 2024 依赖就按规则表降级
      - name: Auto-downgrade remaining incompatibilities
        shell: pwsh
        run: |
          $rules = @{
            "zeroize" = "1.8.1"
          }
          $maxAttempts = 10
          for ($i = 1; $i -le $maxAttempts; $i++) {
            $output = cargo build --release 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "构建成功！"
              break
            }

            $match = [regex]::Match(($output -join "`n"), 'failed to parse manifest at `.*?([^\\/]+)-[\d.]+\\Cargo\.toml`')
            if (-not $match.Success) {
              Write-Host "遇到非 Edition 2024 错误，停止自动降级。"
              $output | Write-Host
              exit 1
            }

            $crateName = $match.Groups[1].Value
            Write-Host "检测到不兼容依赖: $crateName"

            if ($rules.ContainsKey($crateName)) {
              $version = $rules[$crateName]
              Write-Host "降级 $crateName 到 $version"
              cargo update -p $crateName --precise $version
            } else {
              Write-Host "没有为 $crateName 预设兼容版本，无法自动修复。"
              exit 1
            }
          }

      - name: Final build
        run: cargo build --release

      - name: Rename binary
        shell: pwsh
        run: |
          $src = "target/x86_64-pc-windows-gnu/release/mc-downloader.exe"
          if (Test-Path $src) {
            Move-Item $src "target/x86_64-pc-windows-gnu/release/mc-downloader-win7.exe"
          }

      - name: Upload artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: win7-gnu-release
          path: target/x86_64-pc-windows-gnu/release/mc-downloader-win7.exe

      - name: Upload to Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-pc-windows-gnu/release/mc-downloader-win7.exe
          generate_release_notes: true