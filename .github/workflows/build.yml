name: Build Win7-11

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK (for SDK-style project)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore MCDownloader.csproj

      - name: Build
        run: msbuild MCDownloader.csproj /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload artifact (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MCDownloader-net48
          path: bin/Release/

      - name: Upload to Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/MCDownloader.exe
          generate_release_notes: true